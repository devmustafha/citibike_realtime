name: Continuous Integration

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    env:
      CITIBIKE_API_URL: "https://example.com"
      KAFKA_BOOTSTRAP_SERVERS: "localhost:9092"

      BRONZE_STATION_STATUS_PATH: "s3a://bronze/station_status"

      SILVER_STATION_STATUS_PATH: "s3a://silver/station_status"
      SILVER_STATION_CHECKPOINT_PATH: "s3a://checkpoints/station_status"

      MINIO_ENDPOINT: "localhost:9000"
      MINIO_ACCESS_KEY: "test"
      MINIO_SECRET_KEY: "test"
      MINIO_SECURE: "false"

      TELEGRAM_BOT_TOKEN: "test"
      TELEGRAM_CHAT_ID: "test"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install Dependencies
        run: uv sync --locked

      - name: Check Formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .
      
      - name: Run Tests
        run: uv run pytest
    
  docker: 
    name: Docker Validation & Build 
    runs-on: ubuntu-latest 
    steps: 
      - name: Checkout Repository 
        uses: actions/checkout@v4 
      - name: Validate Docker Compose 
        run: docker compose config 
      - name: Build Airflow Image 
        run: docker compose build airflow-webserver 
      - name: Build Spark Image 
        run: docker compose build spark-master