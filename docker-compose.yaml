services:
  minio:
    image: quay.io/minio/minio
    container_name: citibike-minio

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web Console

    volumes:
      - minio-data:/data

    restart: unless-stopped

    networks:
      - citibike-network

  kafka:
    image: apache/kafka:latest
    container_name: citibike-kafka

    hostname: kafka

    ports:
      - "29092:29092"
      
    environment:
      # --- Required KRaft Settings ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # --- Listener Configurations ---
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # --- Single-Node Local Dev Overrides ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data

    networks:
      - citibike-network

    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: citibike-kafka-ui
    hostname: kafka-ui
    ports:
      - "8080:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: citibike
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

    depends_on:
      - kafka

    networks:
      - citibike-network

    restart: unless-stopped
  
  spark-master:
    image: apache/spark:3.5.6
    container_name: citibike-spark-master
    hostname: spark-master
    environment:
      PYTHONPATH: /opt/spark/apps
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
    ports:
      - "7077:7077"
      - "8081:8080"
    volumes:
      - ./spark/apps:/opt/spark/apps
      - ./spark/ivy:/opt/spark/.ivy2
    networks:
      - citibike-network

  spark-worker:
    image: apache/spark:3.5.6
    container_name: citibike-spark-worker
    hostname: spark-worker
    depends_on:
      - spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
    volumes:
      - ./spark/apps:/opt/spark/apps
      - ./spark/ivy:/opt/spark/.ivy2
    networks:
      - citibike-network

volumes:
  minio-data:
  kafka-data:

networks:
  citibike-network:
    driver: bridge