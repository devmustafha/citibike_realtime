x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile

  user: "${AIRFLOW_UID}:0"

  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    PYTHONPATH: /opt/airflow:/opt/spark/apps
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
    TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
    
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow:/opt/airflow
    - ./spark/apps:/opt/spark/apps

  networks:
    - citibike-network

  depends_on:
    postgres:
      condition: service_healthy

services:

  # -----------------------
  # Storage
  # -----------------------
  minio:
    image: quay.io/minio/minio
    container_name: citibike-minio

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}

    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web Console

    volumes:
      - minio-data:/data

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

    networks:
      - citibike-network

  producer:
    build:
      context: .
      dockerfile: producer/Dockerfile
    container_name: citibike-producer

    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - kafka
    restart: unless-stopped
    networks:
      - citibike-network
  # -----------------------
  # Messaging
  # -----------------------
  kafka:
    image: apache/kafka:latest
    container_name: citibike-kafka

    hostname: kafka

    ports:
      - "29092:29092"
      
    environment:
      # --- Required KRaft Settings ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # --- Listener Configurations ---
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # --- Single-Node Local Dev Overrides ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    
    volumes:
      - kafka-data:/var/lib/kafka/data

    networks:
      - citibike-network

    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: citibike-kafka-ui
    hostname: kafka-ui
    ports:
      - "8080:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: citibike
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

    depends_on:
      - kafka

    networks:
      - citibike-network

    restart: unless-stopped
  
  # -----------------------
  # Processing
  # -----------------------
  spark-master:
    # image: apache/spark:3.5.6
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    container_name: citibike-spark-master
    hostname: spark-master
    environment:
      PYTHONPATH: /opt:/opt/producer:/opt/spark/apps
      CITIBIKE_STATION_INFORMATION_URL: ${CITIBIKE_STATION_INFORMATION_URL}
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
    ports:
      - "7077:7077"
      - "8081:8080"
    volumes:
      - ./spark/apps:/opt/spark/apps
      - ./producer:/opt/producer

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

    networks:
      - citibike-network

    restart: unless-stopped

  spark-worker:
    # image: apache/spark:3.5.6
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    container_name: citibike-spark-worker
    hostname: spark-worker
    environment:
      PYTHONPATH: /opt:/opt/producer:/opt/spark/apps
      CITIBIKE_STATION_INFORMATION_URL: ${CITIBIKE_STATION_INFORMATION_URL}
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g

    depends_on:
      spark-master:
        condition: service_healthy

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
    volumes:
      - ./spark/apps:/opt/spark/apps

    networks:
      - citibike-network

    restart: unless-stopped


  # -----------------------
  # Orchestration
  # -----------------------
  airflow-init:
    <<: *airflow-common
    container_name: citibike-airflow-init
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
      --username admin
      --password admin
      --firstname Admin
      --lastname User
      --role Admin
      --email admin@example.com
      "
  airflow-webserver:
    <<: *airflow-common
    container_name: citibike-airflow-webserver

    command: webserver

    ports:
      - "8088:8080"

    depends_on:
      - airflow-init

    restart: unless-stopped
  airflow-scheduler:
    <<: *airflow-common
    container_name: citibike-airflow-scheduler

    command: scheduler

    depends_on:
      - airflow-init

    restart: unless-stopped
  postgres:
    image: postgres:16
    container_name: citibike-airflow-postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - citibike-network

    restart: unless-stopped
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: citibike-dashboard
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      MINIO_ENDPOINT: minio:9000
    depends_on:
      - minio
    networks:
      - citibike-network
volumes:
  minio-data:
  kafka-data:
  airflow-postgres-data:
networks:
  citibike-network:
    driver: bridge