services:
  minio:
    image: quay.io/minio/minio
    container_name: citibike-minio

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web Console

    volumes:
      - minio-data:/data

    restart: unless-stopped

    networks:
      - citibike-network

  kafka:
    image: apache/kafka:latest
    container_name: citibike-kafka

    hostname: kafka

    ports:
        - "9092:9092"

    environment:
        KAFKA_NODE_ID: 1

        KAFKA_PROCESS_ROLES: broker,controller

        KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093

        KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092

        KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

        KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

        KAFKA_LOG_DIRS: /var/lib/kafka/data

    volumes:
        - kafka-data:/var/lib/kafka/data

    networks:
        - citibike-network

    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: citibike-kafka-ui

    ports:
        - "8080:8080"

    environment:
        KAFKA_CLUSTERS_0_NAME: citibike
        KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

    depends_on:
        - kafka

    networks:
        - citibike-network

    restart: unless-stopped
  spark-master:
    image: apache/spark:3.5.9
    container_name: citibike-spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "9090:8080"   # Spark master web UI — moved off 8080 since Airflow's webserver usually owns that port
      - "7077:7077"   # Spark master port — this is what jobs connect to
    volumes:
      - ./spark-jobs:/opt/spark-jobs
      - ./data:/opt/data

  spark-worker-1:
    image: apache/spark:3.5.9
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    container_name: citibike-spark-worker-1
    depends_on:
      - spark-master
    environment:
      - SPARK_WORKER_MEMORY=2g
      - SPARK_WORKER_CORES=2
    volumes:
      - ./spark-jobs:/opt/spark-jobs
      - ./data:/opt/data
volumes:
  minio-data:
  kafka-data:

networks:
  citibike-network:
    driver: bridge